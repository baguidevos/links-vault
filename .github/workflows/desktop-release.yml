name: Desktop Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Target platform to build and publish'
        required: true
        default: 'win'
        type: choice
        options:
          - win
          - all
      release_type:
        description: 'GitHub Release status (draft recommended for review)'
        required: true
        default: 'draft'
        type: choice
        options:
          - draft
          - release

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    name: Build & Publish Windows
    if: inputs.platform == 'win' || inputs.platform == 'all' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, sqlite3, pdo_sqlite, bcmath, curl, fileinfo, zip
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction --no-dev --optimize-autoloader

      - name: Prepare environment file
        shell: pwsh
        run: |
          Copy-Item .env.example .env
          (Get-Content .env) -replace '^APP_NAME=.*$', "APP_NAME=LinksVault" | Set-Content .env
          $tag = "${{ github.ref_name }}"
          if ($tag -match '^v?(\d+\.\d+\.\d+.*)$') {
            $version = $Matches[1]
            (Get-Content .env) -replace '^NATIVEPHP_APP_VERSION=.*$', "NATIVEPHP_APP_VERSION=$version" | Set-Content .env
          }
          (Get-Content .env) -replace '^NATIVEPHP_UPDATER_ENABLED=.*$', "NATIVEPHP_UPDATER_ENABLED=true" | Set-Content .env
          (Get-Content .env) -replace '^GITHUB_RELEASE_TYPE=.*$', "GITHUB_RELEASE_TYPE=release" | Set-Content .env
          php artisan key:generate --force

      - name: Install NPM dependencies
        run: npm ci

      - name: Install Electron dependencies
        run: |
          npm ci
          npm run plugin:build
        working-directory: nativephp/electron

      - name: Build frontend assets
        run: npm run build

      - name: Build Desktop (Windows)
        env:
          APP_NAME: 'LinksVault'
          APP_ENV: production
          NATIVEPHP_APP_NAME: 'LinksVault'
          NATIVEPHP_APP_FILENAME: 'linksvault'
          NATIVEPHP_UPDATER_ENABLED: 'true'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: php artisan native:build win x64 --no-interaction

      - name: Publish Windows release and repair installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Select-String -Path .env -Pattern '^NATIVEPHP_APP_VERSION=').Line.Split('=', 2)[1]
          $tag = "v$version"

          if (-not (Test-Path nativephp/electron/dist)) {
            throw "Dossier nativephp/electron/dist introuvable. Le build electron n'a pas produit de dossier de sortie."
          }

          $setup = Get-ChildItem nativephp/electron/dist -Filter 'LinksVault-*-setup.exe' -File | Select-Object -First 1
          if ($null -eq $setup) {
            $setup = Get-ChildItem nativephp/electron/dist -Filter '*-setup.exe' -File | Select-Object -First 1
          }
          if ($null -eq $setup) {
            throw "Installateur Windows introuvable dans nativephp/electron/dist."
          }

          if ($setup.Name -match '^Laravel-') {
            throw "ERREUR DE NOMMAGE : L'installateur Windows a été généré sous le nom '$($setup.Name)' au lieu de 'LinksVault-$version-setup.exe'. Vérifiez APP_NAME."
          }

          $packageDirectory = Join-Path $env:RUNNER_TEMP 'linksvault-windows-repair'
          New-Item -ItemType Directory -Path $packageDirectory -Force | Out-Null
          Copy-Item $setup.FullName $packageDirectory
          Copy-Item nativephp/electron/build/Install-LinksVault.cmd $packageDirectory
          Copy-Item nativephp/electron/build/Repair-LinksVaultInstall.ps1 $packageDirectory
          $archive = "nativephp/electron/dist/LinksVault-$version-windows-repair.zip"
          Compress-Archive -Path "$packageDirectory\*" -DestinationPath $archive -Force

          $filesToUpload = @($setup.FullName, $archive)
          $latestYml = Get-ChildItem nativephp/electron/dist -Filter 'latest.yml' -File | Select-Object -First 1
          if ($latestYml) {
            Write-Host "Manifeste de mise à jour détecté : $($latestYml.FullName)"
            $filesToUpload += $latestYml.FullName
          } else {
            Write-Warning "Attention : latest.yml introuvable dans dist. Les mises à jour automatiques nécessitent ce manifeste."
          }
          $blockmap = Get-ChildItem nativephp/electron/dist -Filter '*.blockmap' -File | Select-Object -First 1
          if ($blockmap) { $filesToUpload += $blockmap.FullName }

          # Génération automatique du patch différentiel léger (Hot-Patch)
          Write-Host "Génération du patch différentiel pour $tag..."
          try {
            php artisan desktop:make-patch
            $patchFiles = Get-ChildItem storage/app/releases -Filter 'patch-*.zip' -File
            foreach ($p in $patchFiles) {
              Write-Host "Patch différentiel inclus dans les assets : $($p.FullName)"
              $filesToUpload += $p.FullName
            }
          } catch {
            Write-Warning "Avertissement lors de la génération du patch : $_"
          }

          # Vérifier si la release GitHub existe déjà pour ce tag
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null | Out-Null
          $releaseExists = ($LASTEXITCODE -eq 0)

          if ($releaseExists) {
            Write-Host "Mise à jour de la release existante $tag..."
            try {
              $existingAssetsRaw = gh release view $tag --repo $env:GITHUB_REPOSITORY --json assets 2>$null
              if ($existingAssetsRaw) {
                $existingAssets = ($existingAssetsRaw | ConvertFrom-Json).assets
                foreach ($asset in $existingAssets) {
                  if ($asset.name -match '^Laravel-') {
                    Write-Host "Suppression de l'ancien asset mal nommé : $($asset.name)..."
                    gh release delete-asset $tag $asset.name --repo $env:GITHUB_REPOSITORY -y 2>$null | Out-Null
                  }
                }
              }
            } catch {
              Write-Warning "Impossible de nettoyer les anciens assets : $_"
            }
            gh release upload $tag $filesToUpload --repo $env:GITHUB_REPOSITORY --clobber
          } else {
            Write-Host "Création de la release $tag..."
            gh release create $tag $filesToUpload --repo $env:GITHUB_REPOSITORY --title "Release $tag" --notes "Release officielle $tag pour Windows"
          }

      - name: Verify release was published
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Select-String -Path .env -Pattern '^NATIVEPHP_APP_VERSION=').Line.Split('=', 2)[1]
          $tag = "v$version"
          Write-Host "Vérification de la release $tag sur $env:GITHUB_REPOSITORY..."

          $releaseRaw = gh release view $tag --repo $env:GITHUB_REPOSITORY --json assets
          if (-not $releaseRaw) {
            throw "Release $tag introuvable sur $env:GITHUB_REPOSITORY."
          }

          $releaseJson = $releaseRaw | ConvertFrom-Json
          $assetNames = @($releaseJson.assets | ForEach-Object { $_.name })
          Write-Host "Assets trouvés : $($assetNames -join ', ')"

          $hasInstaller = $assetNames | Where-Object { $_ -match '\.exe$' }
          if (-not $hasInstaller) {
            throw "La release $tag existe mais aucun installateur Windows .exe n'a été téléversé !"
          }

          $hasLatestYml = $assetNames | Where-Object { $_ -eq 'latest.yml' }
          if (-not $hasLatestYml) {
            Write-Warning "Attention : Le manifeste latest.yml n'est pas présent dans les assets de $tag !"
          }

          $hasPatch = $assetNames | Where-Object { $_ -match '^patch-.*\.zip$' }
          if ($hasPatch) {
            Write-Host "Patch différentiel validé dans les assets : $($hasPatch -join ', ')"
          }

          Write-Host "Release $tag validée avec succès avec son installateur Windows .exe et son patch différentiel."
